# CI

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight PR runs when a new commit lands on the same PR.
# Main-branch runs are not cancelled so completed work is preserved.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package's `engines.node` pins Node >= 22.19.0 (matching the
        # latest `@earendil-works/pi-coding-agent`). Bump alongside it
        # whenever pi's minimum moves. There is no longer a spawn-pi
        # integration test (it required an LLM key) — the tests run
        # against in-process TypeScript only, so we just need Node.
        node: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test
